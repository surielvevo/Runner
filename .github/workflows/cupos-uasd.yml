# ─────────────────────────────────────────────────────────────────────────────
# Cupos UASD · Programación docente de CupoPino (2026-11-10)
# ─────────────────────────────────────────────────────────────────────────────
# Sustituye al runner de la PC: corre en los servidores de GitHub (gratis e
# ilimitado en un repositorio público), sin depender de ninguna computadora.
#
# Cómo trabaja:
#   · Un TURNO dura ~5 h 40 min y encadena ciclos «priority» de hasta 50 min con
#     el navegador caliente: las materias con menos cupos se refrescan primero y
#     más seguido (la cola va por urgencia), igual que antes. El barrido «full» de
#     respaldo queda solo a mano (modo=full) desde el 2026-11-21 (ver abajo).
#   · RELEVO (2026-11-11): al terminar, cada turno pide él mismo el siguiente (job
#     `relevo`). El horario de cada 30 min queda solo de respaldo: GitHub descarta la
#     mayoría de los horarios seguidos (ese día disparó 3 de 36) y la programación
#     pasó 5 h sin turno. Si el turno falla, el relevo espera 5 min y vuelve a pedir;
#     cancelar un turno a mano SÍ detiene la cadena (para pararla del todo: desactivar
#     el workflow en la pestaña Actions).
#   · Cortés con la UASD: 3 consultas a la vez, pausas de 0,4–0,9 s, lotes de 40
#     (parámetros del ETL de siempre). Nada de ráfagas.
#   · (2026-11-21) Tras el freno de la UASD del 16 al 21-nov: el ritmo se adapta solo (baja
#     al primer freno, sube tras lotes sanos; ver cupos/ritmo.mjs), cada materia se relee según
#     cuánto cambia, un ciclo fallido espera cada vez más (nunca más cada 20 s), y una IP que la
#     UASD veta desde el primer contacto pide otra máquina (job «Pedir otra máquina»).
#     El barrido «full» diario queda solo a mano: el modo priority relee todo con techo de edad.
#   · Cloudflare: perfil de Chromium y proxies que ya pasaron se guardan entre
#     turnos (caché); si la salida directa está bloqueada, el ETL busca un proxy
#     público que pase (ver cupos/proxies.mjs).
#
# Claves: NINGUNA. El turno se identifica con el token OIDC que GitHub firma para cada
# ejecución y la función `etl-puente` de Supabase (que verifica repo, rama y workflow)
# escribe con la clave que vive allí. Opcional: secreto PROXY_SCRAPER_KEY.
# ─────────────────────────────────────────────────────────────────────────────

name: Cupos UASD

on:
  schedule:
    - cron: '7,37 * * * *'
  # Cada cambio del scraper se comprueba con el diagnóstico (no escribe nada).
  push:
    branches: [main]
    paths: ['cupos/**', '.github/workflows/cupos-uasd.yml']
  workflow_dispatch:
    inputs:
      modo:
        description: 'turno = ciclos priority continuos · full = barrido completo · diagnostico = solo comprobar si la UASD responde'
        type: choice
        default: turno
        options: [turno, full, diagnostico]
      horas:
        description: 'Duración del turno en horas (máx. 5.6)'
        default: '5.6'
      turno:
        description: 'todos = las tres partes del catálogo · 0/1/2 = solo esa parte (máquina de reemplazo)'
        type: choice
        default: todos
        options: [todos, '0', '1', '2']
      reemplazo:
        description: 'Cuántas máquinas de reemplazo lleva esta parte (lo pone el propio turno)'
        default: '0'

permissions:
  contents: read
  # Token de identidad firmado por GitHub para el puente `etl-puente` de Supabase:
  # así este repo público no guarda ninguna clave.
  id-token: write

# Una máquina de reemplazo (turno 0/1/2) corre en su propio grupo: entra al momento, mientras
# las otras dos partes del turno principal siguen trabajando.
# OJO: en las expresiones de GitHub `null == '0'` es verdadero (compara como números), así que la
# entrada `turno` solo se mira en ejecuciones manuales, donde siempre llega como texto.
concurrency:
  group: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[turno]') && 'cupos-uasd-diagnostico') || ((github.event_name == 'workflow_dispatch' && (github.event.inputs.turno == '0' || github.event.inputs.turno == '1' || github.event.inputs.turno == '2')) && format('cupos-uasd-reemplazo-{0}', github.event.inputs.turno)) || 'cupos-uasd' }}
  cancel-in-progress: false

jobs:
  turno:
    name: Turno de cupos ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # actions: write solo lo usa el paso «Pedir otra máquina» (el token no llega al ETL).
    permissions:
      contents: read
      id-token: write
      actions: write
    # Tres turnos en paralelo, cada uno en su propia máquina (su propia IP) con una
    # parte fija del catálogo: el triple de lecturas por minuto con la MISMA cortesía
    # por IP. Una máquina de reemplazo trae solo su parte.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'workflow_dispatch' && (github.event.inputs.turno == '0' || github.event.inputs.turno == '1' || github.event.inputs.turno == '2')) && format('[{0}]', github.event.inputs.turno) || '[0, 1, 2]') }}
    defaults:
      run:
        working-directory: cupos
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROXY_SCRAPER_KEY: ${{ secrets.PROXY_SCRAPER_KEY }}
      ESTADO: ${{ github.workspace }}/.estado
      ETL_SHARDS: '3'
      ETL_SHARD: ${{ matrix.shard }}
      HEADLESS: 'false'
      # Puente sin claves (función de Supabase que verifica el token OIDC de este workflow).
      ETL_PUENTE: https://gntczowattweopbrasxs.supabase.co/functions/v1/etl-puente
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cupos/package-lock.json

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('cupos/package-lock.json') }}

      # La red de las máquinas de GitHub a veces no resuelve los espejos de Ubuntu: el
      # 2026-11-11 a las 15:15 UTC los tres turnos murieron aquí. Se reintenta con espera y,
      # como último recurso, se instala el navegador sin los paquetes del sistema.
      - name: Chromium
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-reintentos >/dev/null
          for i in 1 2 3 4 5; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::La instalación del navegador falló (intento $i de 5); reintento en $(( i * 30 )) s."
            sleep $(( i * 30 ))
            sudo apt-get update -qq || true
          done
          echo "::warning::Sin los paquetes del sistema: se instala solo el navegador."
          npx playwright install chromium

      # Perfil de Chromium (cookie cf_clearance) y proxies que ya pasaron, de un turno al siguiente.
      - name: Recuperar estado del turno anterior
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            estado-${{ matrix.shard }}-
            estado-

      - name: Plan
        id: plan
        env:
          MODO: ${{ github.event.inputs.modo || 'turno' }}
          HAY_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
          HAY_CLAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          TURNO_POR_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[turno]') }}
        run: |
          modo="$MODO"
          # Un push es diagnóstico, salvo que su mensaje lleve [turno] (arranque inmediato).
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$TURNO_POR_PUSH" = "true" ]; then modo=turno; else modo=diagnostico; fi
          fi
          # Sin secretos se escribe por el puente OIDC (lo normal en este repo público).
          [ "$HAY_URL" != "true" ] || [ "$HAY_CLAVE" != "true" ] && echo "Escritura por el puente OIDC (sin claves en el repo)."
          true
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          mkdir -p "$ESTADO"

      # Cada cambio del scraper pasa primero las pruebas del cerebro del ETL (ritmo, cada cuánto
      # releer, doble confirmación, veto). Sin red: unos segundos.
      - name: Pruebas (sin red)
        if: steps.plan.outputs.modo == 'diagnostico' && matrix.shard == 0
        run: npm test

      - name: Diagnóstico (¿la UASD responde?)
        if: steps.plan.outputs.modo == 'diagnostico' && matrix.shard == 0
        timeout-minutes: 25
        run: xvfb-run -a node diagnostico.mjs

      - name: Turno
        id: turno
        if: steps.plan.outputs.modo == 'turno' || steps.plan.outputs.modo == 'full'
        env:
          MODO: ${{ steps.plan.outputs.modo }}
          HORAS: ${{ github.event.inputs.horas || '5.6' }}
          REEMPLAZO: ${{ github.event.inputs.reemplazo || '0' }}
          RUNNER_NAME: github-actions-${{ matrix.shard }}
          # Frescura: con tres turnos hay caudal para revisar cada materia el doble de seguido
          # (a menos cupos, más seguido; la escala de urgencia es la misma de siempre).
          PRIORITY_SPEED: '0.5'
          CHROME_PROFILE_DIR: ${{ github.workspace }}/.estado/perfil
          PROXY_CACHE: ${{ github.workspace }}/.estado/proxies-buenos.json
          ETL_TRY_PROXY: 'true'
          PROXY_HUNT_MIN: '5'
          CLEAN_PROFILE_AFTER_STREAK: '4'
          STALE_HOURS: '2'
          HOT_THRESHOLD: '10'
          ETL_PINNED_KEYS: 'LET1310'
          PRO_HUNTER_ENABLED: 'false'
          # (2026-11-21) Ritmo: nunca más rápido que el escalón 1 (2 a la vez, 0,9–1,5 s); arranca
          # en el que aprendió el ciclo anterior. Sin revisitas repetidas en la cola.
          RITMO_TOPE: '1'
          PRO_LANE_RATIO: '0'
        run: |
          # Lee un número de un archivo-señal del ETL (o el valor por defecto). Seguro con bash -e.
          num() { local v=""; if [ -f "$1" ]; then v=$(tr -dc '0-9' < "$1" || true); fi; echo "${v:-$2}"; }
          REEMPLAZO=${REEMPLAZO//[^0-9]/}; REEMPLAZO=${REEMPLAZO:-0}
          fin=$(( SECONDS + $(awk -v h="$HORAS" 'BEGIN{ if (h > 5.6) h = 5.6; if (h < 0.2) h = 0.2; printf "%d", h * 3600 }') ))
          ciclo=0; fallos=0; lecturas=0
          while :; do
            queda=$(( (fin - SECONDS) / 60 ))
            [ "$queda" -lt 8 ] && break
            modo=priority; deadline=$(( queda - 5 < 50 ? queda - 5 : 50 ))
            # El barrido completo queda solo a mano (modo=full): el modo priority ya relee todo con
            # techo de edad (holgadas ≤ 8 h, sin secciones ≤ 24 h) sin dejar la demanda sin atender.
            if [ "$MODO" = "full" ] && [ "$ciclo" -eq 0 ]; then
              modo=full; deadline=$(( queda - 5 < 240 ? queda - 5 : 240 ))
            fi
            ciclo=$(( ciclo + 1 ))
            puede=0; if [ "$REEMPLAZO" -lt 3 ] && [ "$queda" -ge 25 ] && [ "$lecturas" -eq 0 ]; then puede=1; fi
            echo "── Ciclo $ciclo · $modo · hasta $deadline min · $(date -u +%H:%M) UTC · lecturas buenas del turno: $lecturas"
            rm -f "$ESTADO/espera-s" "$ESTADO/veto-ip" "$ESTADO/lecturas-ok"
            inicio=$SECONDS
            if ETL_MODE=$modo ETL_DEADLINE_MIN=$deadline ETL_LECTURAS_TURNO=$lecturas ETL_PUEDE_REEMPLAZAR=$puede \
               timeout --kill-after=60 $(( deadline * 60 + 900 )) xvfb-run -a node etl-cupos.mjs; then
              fallos=0
            else
              fallos=$(( fallos + 1 ))
              echo "::warning::El ciclo $ciclo terminó con error ($fallos seguido(s))."
            fi
            lecturas=$(( lecturas + $(num "$ESTADO/lecturas-ok" 0) ))
            [ "$MODO" = "full" ] && break
            # La UASD veta esta IP desde el primer contacto: otra máquina de GitHub (otra IP).
            if [ -f "$ESTADO/veto-ip" ] && [ "$puede" = 1 ]; then
              horas=$(awk -v s="$(( fin - SECONDS ))" 'BEGIN{ printf "%.2f", s / 3600 }')
              echo "::warning::La UASD veta la IP $(cat "$ESTADO/veto-ip"): se pide otra máquina para la parte $ETL_SHARD ($horas h)."
              { echo "reemplazo=si"; echo "horas=$horas"; } >> "$GITHUB_OUTPUT"
              break
            fi
            # Espera antes del próximo ciclo: la que pide el ETL (descanso de la IP o freno de la
            # UASD) o, si el ciclo falló rápido, un retroceso que se dobla: 1, 2, 4, 8, 16 min.
            # Antes eran 20 s siempre: un turno vetado se relanzó 570 veces el 21-nov.
            espera=$(num "$ESTADO/espera-s" 20)
            if [ "$fallos" -gt 0 ] && [ $(( SECONDS - inicio )) -lt 300 ]; then
              b=$(( 60 << (fallos > 5 ? 4 : fallos - 1) ))
              [ "$b" -gt "$espera" ] && espera=$b
            fi
            tope=$(( fin - SECONDS - 480 ))
            [ "$espera" -gt "$tope" ] && espera=$tope
            if [ "$espera" -gt 0 ]; then echo "   Espera de $espera s antes del próximo ciclo."; sleep "$espera"; fi
          done

      - name: Guardar estado para el próximo turno
        if: always() && steps.plan.outputs.modo != 'nada'
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: estado-${{ matrix.shard }}-${{ github.run_id }}

      # La UASD vetó esta IP antes de que leyéramos nada: una máquina nueva de GitHub trae otra IP
      # y sigue esta misma parte del catálogo hasta el fin del turno (como mucho 3 por turno).
      - name: Pedir otra máquina para esta parte (IP vetada)
        if: ${{ !cancelled() && steps.turno.outputs.reemplazo == 'si' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PARTE: ${{ matrix.shard }}
          HORAS_TURNO: ${{ steps.turno.outputs.horas }}
          REEMPLAZO: ${{ github.event.inputs.reemplazo || '0' }}
        run: |
          r=${REEMPLAZO//[^0-9]/}; siguiente=$(( ${r:-0} + 1 ))
          for i in 1 2 3; do
            gh workflow run cupos-uasd.yml -R "$GITHUB_REPOSITORY" --ref main -f modo=turno -f horas="$HORAS_TURNO" -f turno="$PARTE" -f reemplazo="$siguiente" \
              && { echo "Máquina nueva pedida para la parte $PARTE (reemplazo $siguiente)."; exit 0; }
            sleep $(( i * 15 ))
          done
          echo "::error::No se pudo pedir la máquina nueva: esta parte espera al próximo turno."
          exit 1

  # El siguiente turno lo pide este mismo turno al terminar (bien o con error). Un turno
  # cancelado a mano no se releva. Un fallo espera 5 min antes de pedir (sin bucles rápidos).
  relevo:
    name: Relevo del turno
    needs: turno
    # Una máquina de reemplazo no se releva: el relevo lo pide el turno principal.
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && (github.event.inputs.turno == '0' || github.event.inputs.turno == '1' || github.event.inputs.turno == '2')) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.modo != 'diagnostico') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[turno]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Pedir el siguiente turno
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.turno.result }}
        run: |
          if [ "$RESULTADO" != "success" ]; then
            echo "::warning::El turno terminó con «$RESULTADO»: se espera 5 min antes de pedir el siguiente."
            sleep 300
          fi
          for i in 1 2 3 4 5; do
            gh workflow run cupos-uasd.yml -R "$GITHUB_REPOSITORY" --ref main -f modo=turno -f horas=5.6 && { echo "Siguiente turno pedido."; exit 0; }
            echo "::warning::No se pudo pedir el siguiente turno (intento $i de 5)."
            sleep $(( i * 20 ))
          done
          echo "::error::No se pudo pedir el siguiente turno: queda el horario de respaldo."
          exit 1

      # (2026-11-21) El horario del doctor solo se disparó 2 veces en 12 h (GitHub descarta la
      # mayoría): cada relevo lo despierta, así revisa la salud de los datos al menos cada turno.
      - name: Despertar al doctor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run doctor-cupos.yml -R "$GITHUB_REPOSITORY" --ref main || echo "::warning::No se pudo despertar al doctor."

  # GitHub apaga los horarios de un repositorio público tras 60 días sin actividad.
  # Si el último commit tiene más de 45 días, se deja un latido (un archivo con la fecha).
  latido:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Latido
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > cupos/.latido
            git config user.name "cupos-latido"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cupos/.latido && git commit -m "Latido del horario de cupos" && git push
          else
            echo "Actividad reciente: no hace falta latido."
          fi
